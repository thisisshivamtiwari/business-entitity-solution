<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" role="img" aria-label="Pipeline: two matchers, a stacker and a decision rule" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="979" height="469" rx="10" fill="#fcfcfb" stroke="#e2e1dc"/>
<text x="28" y="38" font-size="17" font-weight="600" text-anchor="start" fill="#0b0b0b">How a record gets matched</text>
<text x="28" y="60" font-size="13" font-weight="400" text-anchor="start" fill="#52514e">Two different matchers score every candidate pair. A third model combines them, then one rule decides.</text>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect x="28" y="205" width="140" height="80" rx="8" fill="#f3f2ef" stroke="#b9b8b2" stroke-width="1.5"/><text x="98.0" y="231" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Raw records</text><text x="98.0" y="251" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">3 sources, 24 million</text><text x="98.0" y="267" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">name, address, country</text>
<text x="208" y="96" font-size="11.5" font-weight="600" text-anchor="start" fill="#52514e">MODEL A  reads the two records together</text>
<text x="208" y="404" font-size="11.5" font-weight="600" text-anchor="start" fill="#52514e">MODEL B  measures the two records with engineered features</text>
<rect x="208" y="110" width="166" height="80" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.5"/><text x="291.0" y="136" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Contrastive encoder</text><text x="291.0" y="156" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">multilingual-e5-small</text><text x="291.0" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">same business, close vectors</text>
<rect x="394" y="110" width="166" height="80" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.5"/><text x="477.0" y="136" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Exact GPU search</text><text x="477.0" y="156" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">32 candidates per record</text><text x="477.0" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">99.65% of true pairs kept</text>
<rect x="580" y="110" width="166" height="80" rx="8" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.5"/><text x="663.0" y="136" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Cross-encoder judge</text><text x="663.0" y="156" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">XLM-RoBERTa + LightGBM</text><text x="663.0" y="172" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">probability per pair</text>
<rect x="208" y="300" width="166" height="80" rx="8" fill="#fdeee8" stroke="#eb6834" stroke-width="1.5"/><text x="291.0" y="326" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Learned normalisation</text><text x="291.0" y="346" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">script dictionary,</text><text x="291.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">legal forms, regions</text>
<rect x="394" y="300" width="166" height="80" rx="8" fill="#fdeee8" stroke="#eb6834" stroke-width="1.5"/><text x="477.0" y="326" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Keys + neighbours</text><text x="477.0" y="346" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">ranker keeps 12 per record</text><text x="477.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">99.43% of true pairs kept</text>
<rect x="580" y="300" width="166" height="80" rx="8" fill="#fdeee8" stroke="#eb6834" stroke-width="1.5"/><text x="663.0" y="326" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Two-pass LightGBM</text><text x="663.0" y="346" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">113 pair features</text><text x="663.0" y="362" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">probability per pair</text>
<line x1="374" y1="150.0" x2="391" y2="150.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="560" y1="150.0" x2="577" y2="150.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="374" y1="340.0" x2="391" y2="340.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="560" y1="340.0" x2="577" y2="340.0" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M168,230 C190,230 190,150.0 205,150.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M168,260 C190,260 190,340.0 205,340.0" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="788" y="140" width="170" height="80" rx="8" fill="#e6f6f0" stroke="#1baf7a" stroke-width="1.5"/><text x="873.0" y="166" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Stacker</text><text x="873.0" y="186" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">LightGBM, 22 features</text><text x="873.0" y="202" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">both scores + context</text>
<rect x="788" y="270" width="170" height="80" rx="8" fill="#e6f6f0" stroke="#1baf7a" stroke-width="1.5"/><text x="873.0" y="296" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Decision rule</text><text x="873.0" y="316" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">one owner per record</text><text x="873.0" y="332" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">score at least 0.70</text>
<path d="M746,150.0 C766,150.0 766,170 785,170" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M746,340.0 C766,340.0 766,192 785,192" fill="none" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<line x1="873" y1="220" x2="873" y2="267" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="873" y="386" font-size="13.5" font-weight="600" text-anchor="middle" fill="#0b0b0b">Matches per record</text>
<text x="873" y="404" font-size="11.5" font-weight="400" text-anchor="middle" fill="#52514e">or an empty list</text>
<line x1="873" y1="350" x2="873" y2="369" stroke="#52514e" stroke-width="1.4" marker-end="url(#ar)"/>
<text x="28" y="448" font-size="11.5" font-weight="400" text-anchor="start" fill="#52514e">Every model is trained on four fifths of the labelled records. The remaining fifth is only scored, and the stacker learns from those scores.</text>
</svg>
