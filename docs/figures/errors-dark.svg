<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 330" width="980" height="330" role="img" aria-label="Wrong merges and missed matches per model on the validation fold" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="979" height="329" rx="10" fill="#1a1a19" stroke="#33332f"/>
<text x="28" y="38" font-size="17" font-weight="600" text-anchor="start" fill="#ffffff">Errors on the validation fold</text>
<text x="28" y="60" font-size="13" font-weight="400" text-anchor="start" fill="#c3c2b7">1,530,716 true pairs across 442,001 records. Lower is better.</text>
<text x="28" y="96" font-size="13.5" font-weight="600" text-anchor="start" fill="#ffffff">Wrong merges</text><text x="135.60000000000002" y="96" font-size="11.5" font-weight="400" text-anchor="start" fill="#c3c2b7">pairs accepted that are not matches</text>
<line x1="178" y1="122" x2="178" y2="288" stroke="#55544f" stroke-width="1"/>
<text x="166" y="149" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Model A</text>
<path d="M178,135 h230.744 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-230.744 z" fill="#3987e5"/>
<text x="420.744" y="150" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">9,781</text>
<text x="166" y="189" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Model B</text>
<path d="M178,175 h62.768 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-62.768 z" fill="#d95926"/>
<text x="252.768" y="190" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">2,782</text>
<text x="166" y="229" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Average of A and B</text>
<path d="M178,215 h64.136 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-64.136 z" fill="#8f8e86"/>
<text x="254.136" y="230" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">2,839</text>
<text x="166" y="269" font-size="12.5" font-weight="500" text-anchor="end" fill="#ffffff">Stacked ensemble</text>
<path d="M178,255 h39.368 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-39.368 z" fill="#199e70"/>
<text x="229.368" y="270" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">1,807</text>
<text x="504" y="96" font-size="13.5" font-weight="600" text-anchor="start" fill="#ffffff">Missed matches</text><text x="628.2" y="96" font-size="11.5" font-weight="400" text-anchor="start" fill="#c3c2b7">true pairs that were not returned</text>
<line x1="654" y1="122" x2="654" y2="288" stroke="#55544f" stroke-width="1"/>
<text x="642" y="149" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Model A</text>
<path d="M654,135 h233.156 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-233.156 z" fill="#3987e5"/>
<text x="899.156" y="150" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">59,289</text>
<text x="642" y="189" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Model B</text>
<path d="M654,175 h180.36 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-180.36 z" fill="#d95926"/>
<text x="846.36" y="190" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">46,090</text>
<text x="642" y="229" font-size="12.5" font-weight="400" text-anchor="end" fill="#ffffff">Average of A and B</text>
<path d="M654,215 h182.152 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-182.152 z" fill="#8f8e86"/>
<text x="848.152" y="230" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">46,538</text>
<text x="642" y="269" font-size="12.5" font-weight="500" text-anchor="end" fill="#ffffff">Stacked ensemble</text>
<path d="M654,255 h163.764 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-163.764 z" fill="#199e70"/>
<text x="829.764" y="270" font-size="12.5" font-weight="600" text-anchor="start" fill="#ffffff">41,941</text>
<text x="28" y="312" font-size="11.5" font-weight="400" text-anchor="start" fill="#c3c2b7">The average of the two scores barely helps. The stacker learns where each model can be trusted, and cuts both kinds of error.</text>
</svg>
